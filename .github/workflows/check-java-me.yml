name: Проверка Java ME

on:
  push:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Скачать библиотеки Java ME
        run: |
          mkdir -p tools
          curl -fLsS --retry 3 -o tools/cldcapi11.jar https://repo.maven.apache.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar
          curl -fLsS --retry 3 -o tools/midpapi20.jar https://repo.maven.apache.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar
      - name: Проверить компиляцию под Java ME
        run: |
          mkdir -p build/classes
          javac -source 1.3 -target 1.1 -bootclasspath tools/cldcapi11.jar:tools/midpapi20.jar -encoding UTF-8 -d build/classes src/Slovomaniya.java
